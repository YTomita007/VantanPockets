<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="carousel-container">
    <div class="carousel">
        <img src="img/food1.jpg" alt="Slide 1">
        <img src="img/food2.jpg" alt="Slide 2">
        <img src="img/food3.jpg" alt="Slide 3">
        <img src="img/food4.jpg" alt="Slide 4">
    </div>
    <button id="prev" class="nav-button">❮</button>
    <button id="next" class="nav-button">❯</button>
</div>

<script src="script.js"></script>
</body>
</html>
